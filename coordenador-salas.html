<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salas - Coordenador</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="coordenador.css">
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* ── Turnos ── */
    .turnos-nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .turno-btn {
      padding: 5px 16px;
      border: none;
      background: none;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      border-radius: 6px;
      transition: all .15s;
      font-family: inherit;
    }
    .turno-btn:hover { background: #f3f4f6; color: #333; }
    .turno-btn.active {
      color: #e11233;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .separador { color: #ccc; line-height: 30px; }

    /* ── Turmas grid ── */
    .turmas-section { display: none; }
    .turmas-section.visible { display: block; }

    .cursos-grid { display: flex; flex-direction: column; gap: 16px; }

    .curso-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .turma-btn {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, transform .1s;
      font-family: inherit;
      min-width: 155px;
    }
    .turma-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .add-turma-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 2px solid #ccc;
      background: #f5f5f5;
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #888;
      transition: all .15s;
      flex-shrink: 0;
    }
    .add-turma-btn:hover { border-color: #e11233; color: #e11233; background: #fff0f2; }

    .del-turma-btn {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 18px; height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,.30);
      color: white;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      z-index: 1;
    }
    .del-turma-btn:hover { background: #e11233; }

    .turma-wrapper {
      position: relative;
      display: inline-block;
    }

    .add-curso-btn {
      padding: 10px 18px;
      border: 2px dashed #ccc;
      background: #f9f9f9;
      border-radius: 10px;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      font-family: inherit;
      transition: all .15s;
      width: fit-content;
      margin-top: 4px;
    }
    .add-curso-btn:hover { border-color: #e11233; color: #e11233; background: #fff0f2; }

    /* ── Modal de horários ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 1.75rem;
      width: min(700px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .modal-header h3 { font-size: 17px; font-weight: 700; color: #222; }
    .modal-close {
      background: none; border: none; font-size: 22px;
      cursor: pointer; color: #888; line-height: 1;
      transition: color .15s;
    }
    .modal-close:hover { color: #e11233; }

    /* Grade de horários */
    .grade-wrapper { overflow-x: auto; }
    .grade {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .grade th, .grade td {
      border: 1px solid #e0e0e0;
      padding: 6px 8px;
      text-align: center;
      min-width: 80px;
    }
    .grade th { background: #f5f5f5; font-weight: 600; color: #444; }
    .grade td:first-child { font-weight: 600; color: #555; background: #fafafa; min-width: 65px; }

    .hora-cell {
      position: relative;
    }
    .hora-cell select {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      color: #333;
      outline: none;
      padding: 2px;
    }
    .hora-cell.filled { background: #fff8f9; }
    .hora-cell.filled select { color: #e11233; font-weight: 600; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
    }
    .btn-cancel {
      padding: 9px 20px; border-radius: 10px; border: 1px solid #ddd;
      background: #f5f5f5; font-size: 13px; cursor: pointer;
      font-family: inherit; color: #555;
      transition: background .15s;
    }
    .btn-cancel:hover { background: #eee; }
    .btn-save {
      padding: 9px 20px; border-radius: 10px; border: none;
      background: #e11233; color: white; font-size: 13px;
      font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background .15s;
    }
    .btn-save:hover { background: #bd0f2c; }

    .badge-aulas {
      font-size: 10px;
      background: #e11233;
      color: white;
      border-radius: 999px;
      padding: 1px 6px;
      margin-left: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="page">
  <aside class="sidebar">
    <div class="logo">
      <i class="ti ti-school"></i>
      <span>Coordenador</span>
    </div>
    <nav>
      <a class="nav-item" href="coordenador-home.html">
        <i class="ti ti-bell"></i>
        <span>Notificações</span>
      </a>
      <a class="nav-item" href="coordenador-horarios.html">
        <i class="ti ti-calendar-time"></i>
        <span>Horários</span>
      </a>
      <a class="nav-item" href="coordenador-calendario.html">
        <i class="ti ti-calendar"></i>
        <span>Calendário</span>
      </a>
      <a class="nav-item active" href="coordenador-salas.html">
        <i class="ti ti-door"></i>
        <span>Salas</span>
      </a>
      <a class="nav-item" href="coordenador-configuracoes.html">
        <i class="ti ti-settings"></i>
        <span>Configurações</span>
      </a>
      <a class="nav-item nav-logout" href="#">
        <i class="ti ti-logout"></i>
        <span>Sair</span>
      </a>
    </nav>
  </aside>

  <main class="main">
    <div class="card">
      <h2 class="card-title">Salas</h2>

      <!-- Seletor de turnos -->
      <div class="turnos-nav">
        <button class="turno-btn" onclick="setTurno('matutino')">Matutino</button>
        <span class="separador">|</span>
        <button class="turno-btn active" onclick="setTurno('integral')">Integral</button>
        <span class="separador">|</span>
        <button class="turno-btn" onclick="setTurno('vespertino')">Vespertino</button>
        <span class="separador">|</span>
        <button class="turno-btn" onclick="setTurno('noturno')">Noturno</button>
      </div>

      <!-- Seções por turno -->
      <div id="sec-matutino" class="turmas-section"></div>
      <div id="sec-integral" class="turmas-section visible"></div>
      <div id="sec-vespertino" class="turmas-section"></div>
      <div id="sec-noturno" class="turmas-section"></div>
    </div>
  </main>
</div>

<!-- Modal de horários da turma -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Horários da Turma</h3>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="grade-wrapper">
      <table class="grade" id="grade-table">
        <thead>
          <tr>
            <th>Horário</th>
            <th>Segunda</th>
            <th>Terça</th>
            <th>Quarta</th>
            <th>Quinta</th>
            <th>Sexta</th>
          </tr>
        </thead>
        <tbody id="grade-body"></tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarHorarios()">Salvar horários</button>
    </div>
  </div>
</div>

<script>
// ── Cores por curso ──────────────────────────────────────────────────────────
const CORES = {
  'Informática':   '#9b27af',
  'Edificações':   '#e06a10',
  'Administração': '#1a5fce',
  'Mecatrônica':   '#e11233',
};

function corDoCurso(curso, corCustom) {
  if (corCustom) return corCustom;
  for (const [k, v] of Object.entries(CORES)) {
    if (curso.includes(k)) return v;
  }
  return '#555';
}

// ── Dados (localStorage) ──────────────────────────────────────────────────────
function carregar() {
  try { return JSON.parse(localStorage.getItem('salas_data')) || defaultData(); }
  catch { return defaultData(); }
}

function defaultData() {
  return {
    matutino:   [],
    integral:   [
      { curso: 'Informática',   turmas: ['1º Informática','2º Informática','3º Informática'], horarios: {} },
      { curso: 'Edificações',   turmas: ['1º Edificações','2º Edificações','3º Edificações'],  horarios: {} },
      { curso: 'Administração', turmas: ['1º Administração','2º Administração','3º Administração'], horarios: {} },
      { curso: 'Mecatrônica',   turmas: ['2º Mecatrônica','3º Mecatrônica'],                  horarios: {} },
    ],
    vespertino: [],
    noturno:    [],
  };
}

function salvarDados() {
  localStorage.setItem('salas_data', JSON.stringify(dados));
}

let dados = carregar();
let turnoAtivo = 'integral';
let modalTurno = '', modalCursoIdx = -1, modalTurmaIdx = -1;

// ── Horários disponíveis por turno ────────────────────────────────────────────
const HORARIOS = {
  matutino:   ['07:00','07:50','08:40','10:00','10:50','11:40'],
  integral:   ['07:00','07:50','08:40','10:00','10:50','11:40','13:30','14:20'],
  vespertino: ['13:00','13:50','14:40','15:30','16:20','17:10'],
  noturno:    ['18:50','19:40','20:30','21:20','22:10'],
};

const DISCIPLINAS = [
  '— nenhuma —','Matemática','Português','História','Geografia','Física','Química',
  'Biologia','Inglês','Educação Física','Filosofia','Sociologia','Informática',
  'Eletroeletrônica','Mecânica','Desenho Técnico','Administração','Edificações',
];

// ── Renderização ─────────────────────────────────────────────────────────────
function renderTurno(turno) {
  const sec = document.getElementById('sec-' + turno);
  const cursos = dados[turno];

  if (!cursos.length) {
    sec.innerHTML = `<div style="color:#bbb;font-size:13px;margin-bottom:12px;">Nenhuma sala neste turno.</div>`;
  } else {
    sec.innerHTML = '<div class="cursos-grid" id="grid-' + turno + '"></div>';
    const grid = document.getElementById('grid-' + turno);
    cursos.forEach((c, ci) => {
      const row = document.createElement('div');
      row.className = 'curso-row';
      row.dataset.cursoIdx = ci;

      c.turmas.forEach((turma, ti) => {
        const totalAulas = contarAulas(c.horarios[turma]);

        const wrapper = document.createElement('div');
        wrapper.className = 'turma-wrapper';

        const btn = document.createElement('button');
        btn.className = 'turma-btn';
        btn.style.background = corDoCurso(c.curso, c.cor);
        btn.innerHTML = turma + (totalAulas ? `<span class="badge-aulas">${totalAulas}</span>` : '');
        btn.onclick = () => abrirModal(turno, ci, ti);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-turma-btn';
        delBtn.title = 'Apagar turma';
        delBtn.innerHTML = '✕';
        delBtn.onclick = (e) => { e.stopPropagation(); apagarTurma(turno, ci, ti); };

        wrapper.appendChild(btn);
        wrapper.appendChild(delBtn);
        row.appendChild(wrapper);
      });

      // Botão + turma
      const addT = document.createElement('button');
      addT.className = 'add-turma-btn';
      addT.title = 'Adicionar turma';
      addT.innerHTML = '+';
      addT.onclick = () => adicionarTurma(turno, ci);
      row.appendChild(addT);

      grid.appendChild(row);
    });
  }

  // Botão adicionar curso
  const addCurso = document.createElement('button');
  addCurso.className = 'add-curso-btn';
  addCurso.innerHTML = '<i class="ti ti-plus"></i> Adicionar curso';
  addCurso.onclick = () => adicionarCurso(turno);
  sec.appendChild(addCurso);
}

function contarAulas(horariosTurma) {
  if (!horariosTurma) return 0;
  let total = 0;
  for (const v of Object.values(horariosTurma)) {
    for (const d of Object.values(v)) {
      if (d && d !== '— nenhuma —') total++;
    }
  }
  return total;
}

function renderTodos() {
  ['matutino','integral','vespertino','noturno'].forEach(renderTurno);
}

function setTurno(turno) {
  turnoAtivo = turno;
  document.querySelectorAll('.turno-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.querySelectorAll('.turmas-section').forEach(s => s.classList.remove('visible'));
  document.getElementById('sec-' + turno).classList.add('visible');
}

// ── Apagar turma ─────────────────────────────────────────────────────────────
async function apagarTurma(turno, cursoIdx, turmaIdx) {
  const curso = dados[turno][cursoIdx];
  const turma = curso.turmas[turmaIdx];

  const { isConfirmed } = await Swal.fire({
    title: 'Apagar turma?',
    html: `A turma <strong>${turma}</strong> e todos os seus horários serão removidos permanentemente.`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Sim, apagar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#e11233',
    customClass: { popup: 'meu-alerta' },
  });

  if (!isConfirmed) return;

  // Remove horários da turma
  delete curso.horarios[turma];
  // Remove a turma da lista
  curso.turmas.splice(turmaIdx, 1);
  // Se o curso ficou sem turmas, remove o curso inteiro
  if (curso.turmas.length === 0) {
    dados[turno].splice(cursoIdx, 1);
  }

  salvarDados();
  renderTurno(turno);
}

// ── Adicionar curso ───────────────────────────────────────────────────────────
async function adicionarCurso(turno) {
  const CORES_PRESET = [
    '#9b27af','#e06a10','#1a5fce','#e11233',
    '#0ea5e9','#16a34a','#d97706','#64748b',
    '#7c3aed','#db2777','#059669','#dc2626',
  ];

  const { value: resultado } = await Swal.fire({
    title: 'Novo curso',
    html: `
      <input id="swal-nome" class="swal2-input" placeholder="Ex: Informática, Mecatrônica…" />
      <div style="margin-top:14px;text-align:left;padding:0 8px;">
        <div style="font-size:12px;color:#888;margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Cor do curso</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;" id="cores-grid">
          ${CORES_PRESET.map(c => `
            <div onclick="selecionarCor('${c}')" data-cor="${c}" style="
              width:28px;height:28px;border-radius:50%;background:${c};
              cursor:pointer;border:3px solid transparent;transition:border-color .15s;box-sizing:border-box;
            "></div>
          `).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="font-size:12px;color:#888;">Personalizada:</label>
          <input type="color" id="cor-custom" value="#9b27af" oninput="selecionarCor(this.value)"
            style="width:32px;height:28px;border:1px solid #ddd;border-radius:6px;padding:2px;cursor:pointer;" />
        </div>
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Próximo',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#e11233',
    customClass: { popup: 'meu-alerta' },
    didOpen: () => { selecionarCor('${CORES_PRESET[0]}'); },
    preConfirm: () => {
      const nome = document.getElementById('swal-nome').value.trim();
      if (!nome) { Swal.showValidationMessage('Digite o nome do curso'); return false; }
      const corEl = document.querySelector('#cores-grid [data-cor].selecionada-cor');
      const cor = corEl ? corEl.dataset.cor : document.getElementById('cor-custom').value;
      return { nome, cor };
    }
  });

  if (!resultado) return;
  const { nome, cor } = resultado;

  const { value: primeiraT } = await Swal.fire({
    title: 'Primeira turma',
    input: 'text',
    inputPlaceholder: 'Ex: 1º Informática',
    inputValue: `1º ${nome}`,
    showCancelButton: true,
    confirmButtonText: 'Criar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#e11233',
    customClass: { popup: 'meu-alerta' },
  });

  dados[turno].push({ curso: nome, cor, turmas: primeiraT ? [primeiraT] : [`1º ${nome}`], horarios: {} });
  salvarDados();
  renderTurno(turno);
}

function selecionarCor(cor) {
  document.querySelectorAll('#cores-grid [data-cor]').forEach(el => {
    const ativo = el.dataset.cor === cor;
    el.style.borderColor = ativo ? '#222' : 'transparent';
    el.classList.toggle('selecionada-cor', ativo);
  });
  const custom = document.getElementById('cor-custom');
  if (custom) custom.value = cor;
}

// ── Adicionar turma ───────────────────────────────────────────────────────────
async function adicionarTurma(turno, cursoIdx) {
  const curso = dados[turno][cursoIdx];
  const { value: nome } = await Swal.fire({
    title: `Nova turma — ${curso.curso}`,
    input: 'text',
    inputPlaceholder: `Ex: ${curso.turmas.length + 1}º ${curso.curso}`,
    inputValue: `${curso.turmas.length + 1}º ${curso.curso}`,
    showCancelButton: true,
    confirmButtonText: 'Adicionar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#e11233',
    customClass: { popup: 'meu-alerta' },
  });
  if (!nome) return;
  curso.turmas.push(nome);
  salvarDados();
  renderTurno(turno);
}

// ── Modal de horários ─────────────────────────────────────────────────────────
function abrirModal(turno, cursoIdx, turmaIdx) {
  modalTurno = turno;
  modalCursoIdx = cursoIdx;
  modalTurmaIdx = turmaIdx;

  const curso  = dados[turno][cursoIdx];
  const turma  = curso.turmas[turmaIdx];
  const horas  = HORARIOS[turno];
  const saved  = curso.horarios[turma] || {};

  document.getElementById('modal-title').textContent = `Horários — ${turma} (${turno.charAt(0).toUpperCase()+turno.slice(1)})`;

  const dias = ['segunda','terca','quarta','quinta','sexta'];
  const diasLabel = ['Segunda','Terça','Quarta','Quinta','Sexta'];

  // Monta cabeçalho
  const thead = document.querySelector('#grade-table thead tr');
  thead.innerHTML = '<th>Horário</th>' + diasLabel.map(d => `<th>${d}</th>`).join('');

  // Monta corpo
  const tbody = document.getElementById('grade-body');
  tbody.innerHTML = '';
  horas.forEach(hora => {
    const tr = document.createElement('tr');
    let td0 = document.createElement('td');
    td0.textContent = hora;
    tr.appendChild(td0);

    dias.forEach(dia => {
      const td = document.createElement('td');
      td.className = 'hora-cell';
      const val = saved[hora] && saved[hora][dia] ? saved[hora][dia] : '';
      if (val && val !== '— nenhuma —') td.classList.add('filled');

      const sel = document.createElement('select');
      sel.dataset.hora = hora;
      sel.dataset.dia  = dia;
      DISCIPLINAS.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        if (d === val) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = function() {
        td.classList.toggle('filled', this.value !== '— nenhuma —');
      };
      td.appendChild(sel);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  document.getElementById('modal-overlay').classList.add('open');
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function salvarHorarios() {
  const curso = dados[modalTurno][modalCursoIdx];
  const turma = curso.turmas[modalTurmaIdx];
  if (!curso.horarios[turma]) curso.horarios[turma] = {};

  document.querySelectorAll('#grade-body select').forEach(sel => {
    const hora = sel.dataset.hora;
    const dia  = sel.dataset.dia;
    if (!curso.horarios[turma][hora]) curso.horarios[turma][hora] = {};
    curso.horarios[turma][hora][dia] = sel.value;
  });

  salvarDados();
  fecharModal();
  renderTurno(modalTurno);

  Swal.fire({
    icon: 'success',
    title: 'Horários salvos!',
    timer: 1500,
    showConfirmButton: false,
    customClass: { popup: 'meu-alerta' },
  });
}

// Fechar modal clicando fora
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});

// ── Init ──────────────────────────────────────────────────────────────────────
renderTodos();
</script>

</body>
</html>
