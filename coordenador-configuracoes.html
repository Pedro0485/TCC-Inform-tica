<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="coordenador.css">
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
</head>
<body>
 
<div class="page">
  <aside class="sidebar">

    <div class="logo">
      <i class="ti ti-school"></i>
      <span>Coordenador</span>
    </div>
  
    <nav>
      <a class="nav-item" href="coordenador-home.html">
        <i class="ti ti-bell"></i>
        <span>Notificações</span>
      </a>
  
      <a class="nav-item" href="coordenador-horarios.html">
        <i class="ti ti-calendar-time"></i>
        <span>Horários</span>
      </a>
  
      <a class="nav-item" href="coordenador-calendario.html">
        <i class="ti ti-calendar"></i>
        <span>Calendário</span>
      </a>
  
      <a class="nav-item" href="coordenador-salas.html">
        <i class="ti ti-door"></i>
        <span>Salas</span>
      </a>
  
      <a class="nav-item active" href="coordenador-configuracoes.html">
        <i class="ti ti-settings"></i>
        <span>Configurações</span>
      </a>

      <a class="nav-item nav-logout" href="#">
      <i class="ti ti-logout"></i>
      <span>Sair</span>
      </a>

    </nav>
  
    
  
  </aside>
 
<main class="main">
  <div class="card">
    <h2 class="card-title">Configurações</h2>

    <div class="config-container">

      <div class="config-section">
        <h3>Aparência</h3>

        <div class="config-item">
          <span>Tema Escuro</span>

          <label class="switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="config-section">
        <h3>Notificações</h3>

        <div class="config-item">
          <span>Receber notificações</span>

          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="config-section">
        <h3>Conta</h3>

        <div class="config-item">
          <span>Nome do Coordenador</span>
          <input type="text" value="Coordenador">
        </div>

        <div class="config-item">
          <span>Email</span>
          <input type="email" value="coordenador@escola.com">
        </div>
      </div>

      <div class="config-section">
        <h3>Segurança</h3>

        <button class="btn-config">
          Alterar Senha
        </button>
      </div>

    </div>
  </div>
</main>

<script>
const toggle = document.getElementById("themeToggle");

if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark-theme");
    toggle.checked = true;
}

toggle.addEventListener("change", () => {

    if(toggle.checked){
        document.body.classList.add("dark-theme");
        localStorage.setItem("theme","dark");
    }else{
        document.body.classList.remove("dark-theme");
        localStorage.setItem("theme","light");
    }

});
</script>
</div>
 
</body>
</html>
