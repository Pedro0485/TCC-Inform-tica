<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../css/coordenador.css">
  <link rel="shortcut icon" href="../../assets/images/logo.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<script>if(localStorage.getItem("theme")==="dark"){document.body.classList.add("dark-theme");}</script> 
<div class="page">
  <aside class="sidebar">

    <div class="logo">
      <i class="ti ti-school"></i>
      <span>Professor</span>
    </div>
  
    <nav>
      <a class="nav-item" href="professor-home.html">
        <i class="ti ti-bell"></i>
        <span>Notificações</span>
      </a>
  
  
      <a class="nav-item" href="professor-calendario.html">
        <i class="ti ti-calendar"></i>
        <span>Calendário</span>

  
      <a class="nav-item active" href="professor-configuracoes.html">
        <i class="ti ti-settings"></i>
        <span>Configurações</span>
      </a>

      <a class="nav-item nav-logout" href="#">
      <i class="ti ti-logout"></i>
      <span>Sair</span>
      </a>

    </nav>
  
    
  
  </aside>
 
<main class="main">
  <div class="card">
    <h2 class="card-title">Configurações</h2>

    <div class="config-container">

      <div class="config-section">
        <h3>Aparência</h3>

        <div class="config-item">
          <span>Tema Escuro</span>

          <label class="switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="config-section">
        <h3>Notificações</h3>

        <div class="config-item">
          <span>Receber notificações</span>

          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="config-section">
        <h3>Conta</h3>

        <div class="config-item">
          <span>Nome do Professor</span>
          <input type="text" id="config-nome" placeholder="Carregando...">
        </div>

        <div class="config-item">
          <span>Email</span>
          <input type="email" id="config-email" placeholder="Carregando...">
        </div>

        <div class="config-item config-item-acao">
          <button class="btn-config" id="btn-salvar-conta">Salvar alterações</button>
        </div>
      </div>

      <div class="config-section">
        <h3>Segurança</h3>

        <div class="config-item">
          <span>Nova senha</span>
          <input type="password" id="config-nova-senha" placeholder="Mínimo 6 caracteres">
        </div>

        <div class="config-item">
          <span>Confirmar nova senha</span>
          <input type="password" id="config-confirmar-senha" placeholder="Repita a nova senha">
        </div>

        <div class="config-item config-item-acao">
          <button class="btn-config" id="btn-alterar-senha">
            Alterar Senha
          </button>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="../../js/professor-configuracoes.js"></script>
</div>
 
  <script src="../../js/notification-center.js"></script>
</body>
</html>
