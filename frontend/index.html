<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="../frontend/assets/images/logo.png" type="image/x-icon">
    <title>Noctopus</title>
  <link rel="stylesheet" href="css/shared/mobile-experience.css?v=16">
</head>

<body>
    <div class="container" id="container">
        <div class="mobile-login-brand" aria-label="Noctopus, Portal Acadêmico">
            <span class="mobile-login-brand-icon" aria-hidden="true"><img src="assets/images/logo.png" alt=""></span>
            <span class="mobile-login-brand-name">Noctopus<small>PORTAL ACADÊMICO</small></span>
        </div>
        <div class="form-container sign-up">
            <form id="entrarTurmaForm">
                <h1>TURMAS</h1>
                <span>preencha os dados para acessar sua turma</span>
                <label class="login-sr-only" for="turma">Turma</label>
                <select id="turma" name="turma" required>
                    <option value="" selected disabled hidden>Selecione sua turma</option>
                    <option value="info">Inform&#225;tica (INFO)</option>
                    <option value="edf">Edifica&#231;&#245;es (EDF)</option>
                    <option value="meca">Mecatr&#244;nica (MECA)</option>
                    <option value="adm">Administra&#231;&#227;o (ADM)</option>
                    <option value="dse">Desenvolvimento de Sistemas (DSE)</option>
                    <option value="mkt">Marketing (MKT)</option>
                    <option value="mecanica">Mecânica</option>
                    <option value="recursos_humanos">Recursos Humanos</option>
                </select>
                <label class="login-sr-only" for="ano">Ano</label>
                <select id="ano" name="ano" required>
                    <option value="" selected disabled hidden>Selecione o ano</option>
                    <option value="1">1º Ano</option>
                    <option value="2">2º Ano</option>
                    <option value="3">3º Ano</option>
                </select>
                <label class="login-sr-only" for="codigo_turma">Código da turma</label>
                <input type="text" id="codigo_turma" name="codigo_turma" minlength="3" maxlength="20" placeholder="Código da Turma" required>

                <button type="submit" id="btnEntrarTurma">Entrar</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form id="entrarProfessorForm">
                <h1>PROFESSORES</h1>
                <label class="login-sr-only" for="loginEmail">Usuário ou email</label>
                <input type="text" id="loginEmail" name="email" placeholder="Usuário ou email" autocomplete="username" required>
                <div class="senha-wrapper">
                    <label class="login-sr-only" for="loginSenha">Senha</label>
                    <input type="password" id="loginSenha" name="senha" placeholder="Senha" autocomplete="current-password" required>
                    <i class="fa-solid fa-eye" id="toggleSenha"></i>
                </div>
                <div class="mensagem" id="msgLogin"></div>
                <button type="submit" id="btnEntrarProfessor">Entrar</button>
            </form>
        </div>
        <div class="toggle-container">
            <h1 class="mobile-login-heading" aria-live="polite">PROFESSORES</h1>
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Olá, professor!</h1>
                    <p>Entre com seus dados para acessar o sistemas acadêmico</p>
                    <button type="button" class="hidden" id="login" aria-pressed="true">PROFESSORES</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá, aluno!</h1>
                    <p>Selecione sua turma e ano para acessar</p>
                    <button type="button" class="hidden" id="register" aria-pressed="false">TURMAS</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/shared/mobile-experience.js?v=5"></script>
</body>

</html>
