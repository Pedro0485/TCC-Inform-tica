<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horários de Aulas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../css/coordenador.css?v=3">
  <link rel="stylesheet" href="../../css/professor-horarios.css?v=4">
  <link rel="shortcut icon" href="../../assets/images/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="../../css/shared/notificacoes-sino.css?v=3">
  <link rel="stylesheet" href="../../css/shared/mobile-experience.css?v=5">
</head>
<body>

<div class="page">
  <aside class="sidebar">
    <div class="logo">
      <i class="ti ti-school"></i>
      <span>Professor</span>
    </div>

    <nav>
      <a class="nav-item" href="professor-home.html">
        <i class="ti ti-bell"></i>
        <span>Notificações</span>
      </a>

      <a class="nav-item active" href="professor-horarios.html">
        <i class="ti ti-clock"></i>
        <span>Horários de Aulas</span>
      </a>

      <a class="nav-item" href="professor-calendario.html">
        <i class="ti ti-calendar"></i>
        <span>Calendário</span>
      </a>

      <a class="nav-item" href="professor-configuracoes.html">
        <i class="ti ti-settings"></i>
        <span>Configurações</span>
      </a>

      <a class="nav-item nav-logout" href="#">
        <i class="ti ti-logout"></i>
        <span>Sair</span>
      </a>
    </nav>
  </aside>

  <main class="main">
    <div class="card">
      <h2 class="card-title">Horários de Aulas</h2>
      <div class="horarios-page-actions">
        <button type="button" class="btn-config" data-salvar-horarios-pdf><i class="ti ti-download"></i> Salvar PDF</button>
        <button type="button" class="btn-config" data-exportar-horarios="png"><i class="ti ti-photo"></i> Salvar imagem</button>
        <button type="button" class="btn-config" data-exportar-horarios="csv"><i class="ti ti-table-export"></i> Salvar planilha</button>
      </div>
      <div id="horarios-semana" class="horarios-semana">
        <div class="horarios-vazio">Carregando...</div>
      </div>
    </div>

</div>

<script src="../../js/professor-horarios.js"></script>
<script src="../../js/shared/salvar-horarios-pdf.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../js/notification-center.js?v=3"></script>
