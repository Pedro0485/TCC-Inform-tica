<div class="page">
  <aside class="sidebar">

    <div class="logo">
      <i class="ti ti-school"></i>
      <span>Aluno</span>
    </div>
  
    <nav>
      <a class="nav-item" href="aluno-home.html">
        <i class="ti ti-bell"></i>
        <span>Notificações</span>
      </a>

      <a class="nav-item" href="aluno-horarios.html">
        <i class="ti ti-clock"></i>
        <span>Horários de Aulas</span>
      </a>

      <a class="nav-item" href="aluno-calendario.html">
        <i class="ti ti-calendar"></i>
        <span>Calendário</span>
      </a>

      <i class="ti ti-logout"></i>
      <span>Sair</span>
      </a>

    </nav>
  
    
  
  </aside>
 
<main class="main">
  <div class="card">
    <h2 class="card-title">Configurações</h2>

    <div class="config-container">
      

      <div class="config-section">
        <h3>Notificações</h3>
        <p class="appearance-help">Essas preferências valem para este navegador. A lista de notificações na página inicial continua disponível.</p>
        <div class="config-item">
          <span>Sino flutuante e avisos rápidos no site</span>
          <label class="switch">
            <input type="checkbox" data-notification-site-preference checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="config-item">
          <span>Avisos do navegador</span>
          <label class="switch">
            <input type="checkbox" data-notification-browser-preference>
            <span class="slider"></span>
          </label>
        </div>
        <p class="appearance-status" data-notification-preferences-status aria-live="polite"></p>
      </div>

  </div>
</main>

</div>
